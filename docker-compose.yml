version: '3'

networks:
  my_network:
    driver: bridge

services:
  poisoning: 
    image: poisoning
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mqtt
    volumes:
      - /home/laude/compatibility_clustering_spectograms/database:/home/app/database
    networks:
      - my_network

  clustering:
    image: clustering
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mqtt
    volumes:
      - /home/laude/compatibility_clustering_spectograms/database:/home/app/database
    networks:
      - my_network

  training:
    image: training
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mqtt
    volumes:
      - /home/laude/compatibility_clustering_spectograms/database:/home/app/database
    networks:
      - my_network

  controller:
    image: controller
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mqtt
    networks:
      - my_network

  mosquitto:
    container_name: mqtt
    expose:
      - "1883"
    ports:
      - "1883:1883"
    restart: unless-stopped
    image: toke/mosquitto
    networks:
      - my_network
